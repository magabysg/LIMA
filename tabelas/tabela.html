<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    
    <!-- Tabelas em HTML -->

    <table border="1"> <!-- Estrutura da Tabela / border == define a espessura da tabela -->

        <thead> <!-- Cabeçalho da Tabela -->
            <tr> <!-- Linha -->

                <th>Pos.</th> <!-- th == adiciona colunas -->
                <th>Piloto</th>
                <th>Pontos</th>
                <th>Vitórias</th>
                <th>Pódios</th>

            </tr>
        </thead>

        <tbody> <!-- Corpo da Tabela -->

            <tr>
                <td>1</td> <!-- Dado da Tabela -->
                <td>A. Antonelli</td>
                <td>292</td>
                <td>8</td>
                <td>12</td>
            </tr>

            <tr>
                <td>2</td>
                <td>G. Russel</td>
                <td>211</td>
                <td>2</td>
                <td>7</td>
            </tr>

            <tr></tr>

            <tr></tr>

            <tr></tr>

        </tbody>

    </table>

</body>
</html>
