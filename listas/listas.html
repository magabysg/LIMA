<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    
    <!-- Listas NÃO ordenadas: que não possui uma ordem especifica -->  

    <ul>

        <li>Salgadinho</li>
        <li>Suco</li>
        <li>Pipoca</li>
        <li>Sucrilhos</li>
        <li>Chocolate</li>
        <li>Whey</li>
        <li>Pão</li>
        <li>Arroz</li>
        <li>Bola de Futebol</li>

    </ul>

    <!-- Listas ordenadas: a ordem importa -->

    <ol>

        <li>Magaby</li>
        <li>Madu</li>
        <li>Andre</li>

    </ol>

    <!-- Listas Aninhasdas -->

    <ul>
        <li>Frutas</li>
        <ul>
            <li>Limão</li>
            <li>Maçã</li>
            <li>Uva</li>
        </ul>

        <li>Bebidas</li>
        <ul>
            <li>Coca-Cola</li>
            <li>Suco de pêssego</li>
            <li>Energetico</li>
        </ul>

    </ul>

</body>
</html>
